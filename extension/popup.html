<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>RelayHub</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>RelayHub</div>
  <div class="actions">
    <button id="btn-sync" class="btn" title="立即同步全部站点">同步</button>
    <button id="btn-add" class="btn btn-primary">＋ 添加</button>
  </div>
</header>

<main id="content">
  <div id="totals" class="totals"></div>
  <div id="sites"></div>
  <div id="empty" class="empty hidden">
    <p>还没有添加站点。</p>
    <p class="muted">填站点地址 + 系统访问令牌 + 数字用户 ID（站点控制台 → 个人设置生成）。</p>
  </div>
</main>

<!-- 添加表单 -->
<div id="add-form" class="add-form hidden">
  <div class="field">
    <span class="field-label">站点地址（打开本插件时所在标签页会自动填入）</span>
    <div class="url-row">
      <input id="f-url" placeholder="https://api.example.com" spellcheck="false">
      <button type="button" class="btn" id="btn-current-tab" title="填入当前标签页的网址">当前页</button>
    </div>
  </div>
  <div class="grid2">
    <label class="field">
      <span class="field-label">系统访问令牌</span>
      <input id="f-token" type="password" placeholder="sk 无关，控制台生成" autocomplete="off" spellcheck="false">
    </label>
    <label class="field">
      <span class="field-label">数字用户 ID</span>
      <input id="f-uid" type="number" placeholder="如 1234">
    </label>
  </div>
  <label class="field">
    <span class="field-label">站点类型</span>
    <select id="f-type">
      <option value="auto">new-api / one-api 系</option>
      <option value="sub2api">Sub2API（账号用邮箱）</option>
      <option value="manual">手动记录（不接 API）</option>
    </select>
  </label>
  <div id="f-s2a" class="hidden">
    <div class="grid2">
      <label class="field">
        <span class="field-label">邮箱</span>
        <input id="f-email" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span class="field-label">密码</span>
        <input id="f-pass2" type="password" autocomplete="off">
      </label>
    </div>
  </div>
  <button type="button" class="btn btn-block" id="btn-auto">🔑 从登录态自动获取令牌 + 用户 ID</button>
  <p class="hint-sm">需先在浏览器的标签页里登录该站。已生成过令牌的站直接复用现有令牌（不影响别处在用的）；从未生成过的才自动生成（旧令牌随之失效）。</p>
  <p id="add-error" class="err hidden"></p>
  <div class="row">
    <span class="spacer"></span>
    <button id="btn-cancel" class="btn">取消</button>
    <button id="btn-save" class="btn btn-primary">保存</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="popup.js"></script>
</body>
</html>
